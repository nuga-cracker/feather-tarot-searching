<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Feather Messenger</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 16px; color: #18181b; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .alphabet-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; justify-content: center; }
        .alpha-btn { width: calc(100% / 7 - 6px); min-width: 36px; padding: 10px 0; border: 1px solid #e4e4e7; background: #fafafa; border-radius: 6px; text-align: center; font-weight: 600; cursor: pointer; font-size: 14px; user-select: none; transition: background-color 0.2s; }
        .alpha-btn:active { background-color: #3b82f6; color: #ffffff; border-color: #3b82f6; }
        
        .search-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        #searchInput { width: 100%; padding: 16px; border: 2px solid #e4e4e7; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; background: #ffffff; }
        #searchInput:focus { border-color: #3b82f6; }
        
        #suggestList { position: absolute; top: 100%; left: 0; width: 100%; background: #ffffff; border: 1px solid #e4e4e7; border-top: none; border-radius: 0 0 8px 8px; max-height: 240px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-top: -2px; }
        .suggest-item { padding: 16px; cursor: pointer; border-bottom: 1px solid #f4f4f5; font-size: 15px; color: #27272a; }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-item:active { background-color: #f0f9ff; }
        
        #resultArea { display: none; padding-top: 24px; border-top: 2px solid #f4f4f5; animation: fadeIn 0.3s ease; }
        .card-title { font-size: 26px; font-weight: 800; color: #3b82f6; margin: 0 0 8px 0; }
        .card-meta { font-size: 13px; color: #71717a; font-weight: 600; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 0.5px; }
        .card-message { background: #f0f9ff; border-left: 4px solid #3b82f6; padding: 18px; border-radius: 0 8px 8px 0; font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #0f172a; }
        .card-details { display: grid; grid-template-columns: 1fr; gap: 10px; font-size: 14px; margin-bottom: 24px; }
        .detail-row { background: #fafafa; border: 1px solid #e4e4e7; padding: 12px; border-radius: 8px; color: #3f3f46; }
        .detail-row strong { color: #18181b; }
        .card-aff { text-align: center; font-style: italic; background: #fffbeb; padding: 18px; border-radius: 8px; color: #92400e; font-weight: 500; line-height: 1.5; border: 1px solid #fef3c7; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="alphabet-grid" id="alphaBtns"></div>
    
    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="카드 이름 검색 (예: Owl, Swan...)" autocomplete="off">
        <div id="suggestList"></div>
    </div>

    <div id="resultArea">
        <h2 class="card-title" id="resTitle"></h2>
        <div class="card-meta" id="resMeta"></div>
        <div class="card-message" id="resMsg"></div>
        <div class="card-details">
            <div class="detail-row" id="resEnergy"></div>
            <div class="detail-row" id="resColor"></div>
        </div>
        <div class="card-aff" id="resAff"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const deckData = [
        { name: "Blackbird", msg: "보이지 않는 세계의 신비와 마법을 환영하세요. 어둠 속에서 찾은 영감이 당신의 숨겨진 잠재력을 깨워줄 것입니다.", energy: "Mystery, Hidden potential", season: "Spring, Summer, Fall", elem: "Air, Water", color: "Black, Red", aff: "나는 삶의 신비와 마법을 받아들이고 그 안으로 기꺼이 나아갑니다." },
        { name: "Bluebird", msg: "당신의 공간에 평화와 기쁨의 축복을 전합니다. 자신에게 전하는 메시지가 친절하고 긍정적인지 확인해 보세요.", energy: "Happiness, Joy, Peace", season: "Winter, Spring", elem: "Air", color: "Blue", aff: "나는 내 삶 속에 더 깊은 평화와 기쁨의 감각을 초대합니다." },
        { name: "Blue Jay", msg: "자신이 가진 다양한 기술과 특성을 통합하여 숙련된 마스터로서 목표를 향해 나아가세요.", energy: "Mastery, Communication, Family", season: "All year round", elem: "Earth, Air", color: "Blue, White, Black", aff: "나는 나의 모든 부분을 되찾고 최고의 잠재력을 향해 마음을 엽니다." },
        { name: "Canary", msg: "자신의 목소리를 사용하여 다른 이들을 고양시키고 치유하세요. 이제 주저함을 버리고 당당하게 표현할 때입니다.", energy: "Communication, Sensitivity", season: "All year round", elem: "Fire, Air", color: "Yellow, Blue", aff: "나는 나의 표현이 깨어나도록 허용합니다. 나는 독특하고 가치 있는 존재입니다." },
        { name: "Cardinal", msg: "자신감과 자존감을 가지고 리더십의 기회를 잡으세요. 당신은 이 여정에서 매우 중요한 존재임을 기억하세요.", energy: "Leadership, Self-worth, Vitality, Confidence", season: "Winter", elem: "Fire, Air", color: "Red, Black", aff: "나는 자신감을 가지고 새로운 기회들을 기꺼이 수용합니다." },
        { name: "Chickadee", msg: "삶을 되돌아보고 낡은 패턴을 버릴 공간을 만드세요. 새로운 변화의 징후에 주의를 기울일 때입니다.", energy: "Communication, Activity, Adaptability", season: "Spring, Fall", elem: "Earth, Air", color: "Black, White, Grey, Brown", aff: "나는 나를 붙잡고 있는 모든 생각과 패턴을 기꺼이 놓아줍니다." },
        { name: "Condor", msg: "지나온 투쟁과 고난을 넘어 이제 삶을 더 넓은 시야로 바라보세요. 당신은 이미 그것을 이겨낼 힘을 가지고 있습니다.", energy: "Improvement, Power, Adaptability", season: "Winter, Fall", elem: "Earth, Air", color: "Black, White, Grey, Brown", aff: "나의 최고의 비전은 넓고 광활합니다. 나는 나를 기다리는 모든 것을 환영합니다." },
        { name: "Crane", msg: "당신을 지지해 줄 장기적인 파트너십과 관계의 강화가 다가오고 있습니다. 감성 지능을 활용해 주변을 살피세요.", energy: "Longevity, Creation, Union", season: "All year round", elem: "Water, Air", color: "White, Grey", aff: "나는 이제 나의 신성한 파트너십을 신뢰하고 받아들일 준비가 되었습니다." },
        { name: "Crow", msg: "우주의 법칙과 창조의 힘을 믿고 당신이 원하는 것을 현실로 만들기 시작하세요. 이 과정을 즐기길 바랍니다.", energy: "Creation, Universal laws, Communication", season: "All year round", elem: "Earth, Air", color: "Black, Purple", aff: "나는 나의 높은 연결성을 인정하며, 강력한 창조의 채널이 됩니다." },
        { name: "Dove", msg: "평화와 사랑, 축복의 메시지가 도착했습니다. 숨을 고르고 내면의 고요함을 되찾아 세상과 연결되세요.", energy: "Peace, Happiness, Serenity", season: "All year round", elem: "Earth, Water, Air", color: "White, Ivory, Grey", aff: "평화는 내 안과 주변에 늘 존재하며, 나는 이를 감사히 나눕니다." },
        { name: "Duck", msg: "삶이 너무 바빠 길을 잃었다면, 당신을 가장 편안하게 해주는 커뮤니티와 장소로 돌아가 위로를 얻으세요.", energy: "Emotional support, Comfort, Community", season: "Spring, Summer", elem: "Earth, Water, Air", color: "White, Brown, Teal, Green, Black", aff: "나는 나에게 안전과 지지를 제공하는 친구와 환경을 환영합니다." },
        { name: "Eagle", msg: "영적 각성이 일어나고 있습니다. 더 높은 관점에서 삶을 바라보고 개인적인 책임을 다해 새로운 비전을 세우세요.", energy: "Power, Perception, Spiritual insight, Knowledge", season: "Summer", elem: "Fire, Air", color: "White, Black, Brown, Yellow", aff: "나는 나의 힘과 지식, 그리고 비전에 지금 깨어납니다." },
        { name: "Falcon", msg: "당신은 이미 목표를 이룰 기술과 통찰력을 갖췄습니다. 망설임 없이 도약하여 원하는 바를 쟁취하세요.", energy: "Power, Perception, Empowerment", season: "Summer, Fall", elem: "Fire, Air", color: "White, Brown", aff: "나는 나의 본능을 따르며 나의 최고의 목표를 달성합니다." },
        { name: "Finch", msg: "기쁨과 풍요로운 기회들이 다가옵니다. 활동과 휴식 사이의 균형을 유지하며 새로운 시작을 준비하세요.", energy: "Vitality, Energy, Abundance", season: "Summer", elem: "Air", color: "White, Brown, Red, Grey, Yellow", aff: "나는 새로운 풍요와 빛을 맞이하고 포용할 준비가 되었습니다." },
        { name: "Flicker", msg: "자연스러운 변화의 리듬을 신뢰하세요. 과거의 패턴에 대한 저항을 버리고 긍정적인 성장의 흐름을 따르세요.", energy: "New rhythm, Growth", season: "Summer", elem: "Earth, Air", color: "White, Black, Red", aff: "나는 삶의 무한한 리듬과 흐름을 신뢰합니다." },
        { name: "Goose", msg: "채워지지 않은 욕망이 새로운 에너지를 자극합니다. 이제 당신의 진정한 퀘스트를 찾아 신속하게 움직일 때입니다.", energy: "Travel, Communication, Fulfillment", season: "Spring, Fall", elem: "Earth, Water, Air", color: "White, Black, Grey, Brown", aff: "나는 이제 나의 진정한 탐구를 시작하며 가슴을 열어 성취를 맞이합니다." },
        { name: "Grouse", msg: "신성한 춤과 움직임을 통해 내면의 고요함과 연결되세요. 당신만의 신성한 소용돌이를 찾을 시간입니다.", energy: "Movement, Stillness, Life cycle", season: "Spring", elem: "Earth, Air", color: "White, Black, Brown", aff: "나는 내 안의 독특하고 신성한 나선형의 힘을 찾고 그것에 마음을 엽니다." },
        { name: "Hawk", msg: "당신의 직관적인 인식이 옳음을 확인해 줍니다. 놓치고 있었던 신호나 동시성에 주의를 기울이세요.", energy: "Communication, Vision, Messages", season: "Spring, Fall", elem: "Air", color: "White, Black, Brown", aff: "통찰과 영감은 나의 신성한 전령입니다. 나는 그 안내를 듣고 받아들입니다." },
        { name: "Heron", msg: "남의 시선을 신경 쓰지 말고 당신만의 독특한 길을 걷으세요. 인내심을 갖고 당신의 경로가 펼쳐지도록 두세요.", energy: "Self-reliance, Balance, Choice", season: "Spring", elem: "Water, Air", color: "White, Blue, Grey, Brown", aff: "나는 이제 나의 진정한 삶의 목적을 수용하고 받아들입니다." },
        { name: "Hummingbird", msg: "과거의 부담과 부정적인 에너지를 털어내고 지금 이 순간의 달콤함과 기쁨을 만끽하세요. 가벼운 존재가 되는 것이 선물입니다.", energy: "Joy, Sweetness, Freedom", season: "Summer", elem: "Air", color: "Red, White, Green", aff: "나는 가볍고 즐거우며 자유롭습니다. 나는 삶의 달콤함을 품습니다." },
        { name: "Kingfisher", msg: "풍요와 번영의 약속이 다가옵니다. 너무 애쓰지 말고 자연스러운 흐름이 당신에게 오도록 마음을 열고 준비하세요.", energy: "Prosperity, Luck, New warmth", season: "Summer", elem: "Air, Water", color: "Red, White, Green, Grey, Blue", aff: "나의 세상은 사랑스럽고 풍요롭습니다. 나는 이 선물들을 받기 위해 마음을 엽니다." },
        { name: "Loon", msg: "당신의 꿈에 주의를 기울이세요. 보이지 않는 세계에서의 메시지가 꿈을 통해 더 선명하고 상징적으로 나타날 것입니다.", energy: "Dreams, Messages, Consciousness", season: "Summer", elem: "Air, Water", color: "Black, White", aff: "나의 꿈과 비전은 강력하고 활기차며 명확합니다." },
        { name: "Magpie", msg: "물질적인 집착보다는 내면과 외면의 균형을 찾으세요. 조만간 마법 같은 행운의 기회가 찾아올 것입니다.", energy: "Materialism, Balance, Good fortune", season: "Spring, Summer", elem: "Air", color: "Black, White", aff: "나는 나의 경로에 진실하고 균형을 유지하는 데 필요한 것만을 구합니다." },
        { name: "Meadowlark", msg: "자기 발견의 멋진 모험이 시작됩니다. 당신의 내면의 힘과 자신감을 믿고 유쾌한 마음으로 성장을 즐기세요.", energy: "Self-development, Cheerfulness", season: "Summer", elem: "Earth, Air", color: "Black, Yellow, White", aff: "나는 내 안의 빛이라는 반가운 선물을 소중히 여기기로 선택합니다." },
        { name: "Nuthatch", msg: "영감을 얻기 위해 높이 날아오르되, 그 지혜를 현실 세계에서 실질적인 행동으로 옮기세요. 신선한 시각이 필요합니다.", energy: "Grounding, Faith, New perspectives", season: "Summer", elem: "Earth, Air", color: "Black, Blue, White, Grey, Brown", aff: "흔들리지 않는 믿음으로, 나는 새로운 관점이 나타나도록 허용합니다." },
        { name: "Oriole", msg: "창의성을 발휘해 새로운 아이디어를 삶에 엮어 넣으세요. 태양처럼 긍정적인 변화와 성공이 당신을 기다립니다.", energy: "Happiness, New projects, Creativity", season: "Summer", elem: "Air, Fire", color: "Orange, Yellow, Black", aff: "나의 창의성과 프로젝트들은 황금빛으로 축복받았습니다." },
        { name: "Osprey", msg: "성공과 풍요의 징조입니다. 우선순위를 명확히 정하고 당신의 독특한 기술을 활용해 목표에 과감히 뛰어드세요.", energy: "Abundance, Success, Skill", season: "Summer, Fall", elem: "Water, Air", color: "Black, White, Grey, Brown", aff: "나는 내 삶의 신성한 풍요로움에 감사합니다." },
        { name: "Ostrich", msg: "머릿속의 지식을 실질적으로 적용할 시간입니다. 가끔은 내면을 깊이 들여다보며 당신의 진실을 존중하세요.", energy: "Grounding, Truth, Choice", season: "All year round", elem: "Earth", color: "Black, White, Grey, Brown", aff: "진실이 나의 여정을 안내합니다. 나는 이 방식 안에서 완전히 접지됩니다." },
        { name: "Owl", msg: "당신의 직관은 정확합니다. 어둠이나 불확실성에 저항하지 말고 내면의 지혜를 통해 답을 명확히 찾아내세요.", energy: "Intuition, Listening, Awareness", season: "Fall", elem: "Air", color: "Black, White, Grey, Brown", aff: "나의 직관은 강력하고 활기찹니다. 나는 이 내면의 지혜를 존중합니다." },
        { name: "Parrot", msg: "타인의 의견이나 판단에 휘둘리지 말고 당신만의 독특한 목소리를 내세요. 당신의 개성을 빛낼 용기가 필요합니다.", energy: "Personal expression, Color, Individuality", season: "All year round", elem: "Air", color: "Blue, Green, Yellow, Red, White", aff: "나는 세상에서 나의 개성과 독특한 표현을 존중합니다." },
        { name: "Peacock", msg: "낡은 경험을 벗어던지고 지혜로운 영혼으로서 다시 태어나세요. 당신의 영혼이 여정을 안내하고 있음을 믿으세요.", energy: "Vision, Rebirth, Watchfulness", season: "Spring, Fall", elem: "Earth, Air", color: "Blue, Green, Gold, Brown", aff: "나는 내 영혼의 신성한 지혜에 대한 더 큰 이해를 구합니다." },
        { name: "Pelican", msg: "용서의 힘을 사용해 과거의 고통과 죄책감을 털어내세요. 자신과 타인을 용서할 때 비로소 더 가볍게 날아오를 수 있습니다.", energy: "Forgiveness, Selflessness, Emotions", season: "Spring, Summer, Fall", elem: "Water, Air", color: "Brown, White", aff: "나는 모든 것과 모든 사람을, 특히 나 자신을 용서합니다." },
        { name: "Pheasant", msg: "가정생활과 창의적인 프로젝트에 관심을 기울이세요. 조화롭고 지지적인 환경이 당신의 창조적 에너지를 깨울 것입니다.", energy: "Creativity, Fertility, Sexuality", season: "All year round", elem: "Earth, Air", color: "Brown, White, Cream", aff: "나는 활기차고 생동감 넘치며 창조적인 존재입니다." },
        { name: "Raven", msg: "당신의 개인적인 힘을 인정하고 우주의 신호를 따르세요. 당신의 잠재력은 무한하며 이제 그것을 소유할 때입니다.", energy: "Insight, Prophecy, Power", season: "Fall, Winter", elem: "Earth, Air", color: "Black, Blue, Purple", aff: "나는 나의 신성한 힘을 주장하며 무한한 잠재력에 마음을 엽니다." },
        { name: "Robin", msg: "새로운 성장이 곧 시작됩니다. 정체된 영역에서 변화를 느끼고 자연이 주는 긍정적인 메시지에 귀를 기울이세요.", energy: "New growth, Good fortune, Cheer", season: "Winter, Spring", elem: "Fire, Air", color: "Brown, Red", aff: "모든 새로운 기회는 나에게 선물이며 축복입니다." },

        { name: "White Owl", msg: "더 예리한 감각으로 영적인 안내에 귀를 기울이세요. 동시성이나 직관을 통해 오는 메시지를 신뢰하고 따를 때입니다.", energy: "Intuition, Wisdom, Knowing", season: "Fall", elem: "Air", color: "White", aff: "나는 내 안에서 솟아나는 신성한 메시지와 안내를 소중히 여깁니다." }
    ];

    const alphaBtns = document.getElementById('alphaBtns');
    const searchInput = document.getElementById('searchInput');
    const suggestList = document.getElementById('suggestList');
    const resultArea = document.getElementById('resultArea');

    const alphabets = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    
    alphabets.forEach(char => {
        const btn = document.createElement('div');
        btn.className = 'alpha-btn';
        btn.innerText = char;
        btn.addEventListener('click', () => {
            searchInput.value = char;
            handleSearch(char);
        });
        alphaBtns.appendChild(btn);
    });

    searchInput.addEventListener('input', (e) => {
        handleSearch(e.target.value);
    });

    function handleSearch(query) {
        suggestList.innerHTML = '';
        if (!query.trim()) {
            suggestList.style.display = 'none';
            return;
        }

        const filtered = deckData.filter(item => item.name.toLowerCase().includes(query.toLowerCase()));
        
        if (filtered.length > 0) {
            suggestList.style.display = 'block';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggest-item';
                div.innerText = item.name;
                div.addEventListener('click', () => {
                    displayResult(item);
                });
                suggestList.appendChild(div);
            });
        } else {
            suggestList.style.display = 'none';
        }
    }

    function displayResult(item) {
        searchInput.value = item.name;
        suggestList.style.display = 'none';
        resultArea.style.display = 'block';
        
        document.getElementById('resTitle').innerText = item.name;
        document.getElementById('resMeta').innerText = `${item.season} • ${item.elem}`;
        document.getElementById('resMsg').innerText = item.msg;
        document.getElementById('resEnergy').innerHTML = `<strong>에너지:</strong> ${item.energy}`;
        document.getElementById('resColor').innerHTML = `<strong>색상:</strong> ${item.color}`;
        document.getElementById('resAff').innerText = item.aff;

        setTimeout(() => {
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
    }

    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestList.contains(e.target)) {
            suggestList.style.display = 'none';
        }
    });
});
</script>
